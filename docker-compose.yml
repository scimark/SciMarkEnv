# Локальное окружение SciMark: БД, брокер, pgadmin и MCP-серверы для Claude.
# Все адреса и секреты - только в .env (шаблон: .env.example).
name: scimark-env

services:
  postgres:
    image: postgres
    container_name: postgres
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=8MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан в .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER не задан в .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD не задан в .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL не задан в .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD не задан в .env}
    ports:
      - "1234:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      - postgres
    restart: unless-stopped

  # Jira/Confluence (Server/DC), только чтение.
  # Claude Code: claude mcp add --transport http atlassian http://localhost:9000/mcp --scope user
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    container_name: mcp-atlassian
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      JIRA_URL: ${JIRA_URL:?JIRA_URL не задан в .env}
      JIRA_PERSONAL_TOKEN: ${JIRA_PERSONAL_TOKEN:?JIRA_PERSONAL_TOKEN не задан в .env}
      CONFLUENCE_URL: ${CONFLUENCE_URL:?CONFLUENCE_URL не задан в .env}
      CONFLUENCE_PERSONAL_TOKEN: ${CONFLUENCE_PERSONAL_TOKEN:?CONFLUENCE_PERSONAL_TOKEN не задан в .env}
      READ_ONLY_MODE: ${ATLASSIAN_READ_ONLY:-true}
      TOOLSETS: ${ATLASSIAN_TOOLSETS:-all}
      ALLOW_GLOBAL_CRED_FALLBACK: "true"
      JIRA_SSL_VERIFY: ${ATLASSIAN_SSL_VERIFY:-false}
      CONFLUENCE_SSL_VERIFY: ${ATLASSIAN_SSL_VERIFY:-false}
    ports:
      - "127.0.0.1:9000:9000"              # только localhost
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # Jenkins через REST API.
  # Claude Code: claude mcp add --transport http jenkins http://localhost:9887/mcp --scope user
  mcp-jenkins:
    image: ghcr.io/lanbaoshen/mcp-jenkins:latest
    container_name: mcp-jenkins
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "9887"]
    environment:
      JENKINS_URL: ${JENKINS_URL:?JENKINS_URL не задан в .env}
      JENKINS_USERNAME: ${JENKINS_USERNAME:?JENKINS_USERNAME не задан в .env}
      JENKINS_PASSWORD: ${JENKINS_PASSWORD:?JENKINS_PASSWORD не задан в .env}
      JENKINS_TIMEOUT: ${JENKINS_TIMEOUT:-30}
    ports:
      - "127.0.0.1:9887:9887"              # только localhost
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # GitHub, только чтение. Токен передаёт клиент в заголовке, в .env не нужен.
  # Claude Code: claude mcp add --transport http github http://localhost:8082 --scope user ^
  #   --header "Authorization: Bearer <classic PAT>" --header "X-MCP-Readonly: true"
  mcp-github:
    image: ghcr.io/github/github-mcp-server:latest
    container_name: mcp-github
    command: ["http", "--port", "8082", "--read-only", "--toolsets", "context,repos,pull_requests"]
    ports:
      - "127.0.0.1:8082:8082"              # только localhost
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  # Делегирование задач командному LLM. Рабочая папка смонтирована только на чтение.
  # Claude Code: claude mcp add --transport http llm http://localhost:8765/mcp --scope user
  mcp-llm:
    build: ./llm-mcp
    image: scimark/mcp-llm:local
    container_name: mcp-llm
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_THINKING: ${LLM_THINKING:-true}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-xhigh}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-900}
      WORKSPACE_HOST_PREFIX: ${WORKSPACE_HOST_PREFIX:-C:\Scimark}
      # Jira/Confluence для *_digest - только GET-запросы
      JIRA_URL: ${JIRA_URL:-}
      JIRA_PERSONAL_TOKEN: ${JIRA_PERSONAL_TOKEN:-}
      CONFLUENCE_URL: ${CONFLUENCE_URL:-}
      CONFLUENCE_PERSONAL_TOKEN: ${CONFLUENCE_PERSONAL_TOKEN:-}
      ATLASSIAN_SSL_VERIFY: ${ATLASSIAN_SSL_VERIFY:-false}
    volumes:
      - ${WORKSPACE_DIR:-/mnt/c/Scimark}:/workspace:ro
    ports:
      - "127.0.0.1:8765:8765"              # только localhost
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

# Тома со старыми данными (созданы ещё стеком из C:\Scimark\env).
# external: compose их не создаёт и не удаляет даже при `down -v`.
# На чистой машине один раз: docker volume create env_postgres-data (и остальные).
volumes:
  postgres-data:
    name: env_postgres-data
    external: true
  rabbitmq-data:
    name: env_rabbitmq-data
    external: true
  pgadmin-data:
    name: env_pgadmin-data
    external: true
