services:
  postgres:
    image: postgres
    container_name: postgres
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=8MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан в .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER не задан в .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD не задан в .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL не задан в .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD не задан в .env}
    ports:
      - "1234:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      - postgres
    restart: unless-stopped

  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    container_name: mcp-atlassian
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      JIRA_URL: ${JIRA_URL:?JIRA_URL не задан в .env}
      JIRA_PERSONAL_TOKEN: ${JIRA_PERSONAL_TOKEN:?JIRA_PERSONAL_TOKEN не задан в .env}
      CONFLUENCE_URL: ${CONFLUENCE_URL:?CONFLUENCE_URL не задан в .env}
      CONFLUENCE_PERSONAL_TOKEN: ${CONFLUENCE_PERSONAL_TOKEN:?CONFLUENCE_PERSONAL_TOKEN не задан в .env}
      READ_ONLY_MODE: "true"
      TOOLSETS: "all"
      ALLOW_GLOBAL_CRED_FALLBACK: "true"
      JIRA_SSL_VERIFY: "false"
      CONFLUENCE_SSL_VERIFY: "false"
    ports:
      - "127.0.0.1:9000:9000"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  pgadmin-data: