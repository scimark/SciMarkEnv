services:
  postgres:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_DB: honest-sign
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 5G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d honest-sign"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 5G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "1234:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          memory: 5G
    depends_on:
      - postgres
    restart: unless-stopped

  # MCP-сервер для Jira/Confluence (Server/DC), только чтение.
  # Claude Code подключается к нему по URL: http://localhost:9000/mcp
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    container_name: mcp-atlassian
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      JIRA_URL: https://jira.predictor.su
      JIRA_PERSONAL_TOKEN: ${JIRA_PERSONAL_TOKEN}
      CONFLUENCE_URL: https://confluence.predictor.su
      CONFLUENCE_PERSONAL_TOKEN: ${CONFLUENCE_PERSONAL_TOKEN}
      READ_ONLY_MODE: "true"
      JIRA_SSL_VERIFY: "false"
      CONFLUENCE_SSL_VERIFY: "false"
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  pgadmin-data:
